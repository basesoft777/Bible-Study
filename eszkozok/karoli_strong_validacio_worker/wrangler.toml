# F175.V21 — a validációs Worker (DT-F175vp). Titok nincs benne: az admin-kulcs Cloudflare secret
# (`wrangler secret put ADMIN_KULCS`), az ellenőri tokenek csak SHA-256-tal a D1-ben, maguk a letétben.
# A D1 adatbázist EU-jurisdikcióval kell létrehozni:
#   npx wrangler d1 create karoli-strong-validacio --jurisdiction eu
# és a kiírt database_id-t ide beírni (az azonosító nem titok). Lépések: README.md.
name = "karoli-strong-validacio"
main = "src/index.js"
compatibility_date = "2025-10-01"
workers_dev = true
preview_urls = false

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "none"

[[d1_databases]]
binding = "DB"
database_name = "karoli-strong-validacio"
database_id = "2f11f7ce-7ab2-4d95-b7e4-f3606e29f7ce"

[observability]
enabled = false
