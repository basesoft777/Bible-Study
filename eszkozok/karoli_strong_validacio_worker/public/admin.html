<!doctype html>
<html lang="hu">
<head>
<!-- F175.V21 — a szervező haladás-oldala (DT-F175vp). Csak a haladást mutatja (hány tételnél van ítélet, utolsó
     mentés, kész-e); ítéletet nem. Az admin-kulcs a böngészőben csak a lap bezárásáig marad (sessionStorage).
     Az export (a válaszok) nem itt, hanem a kiértékeléskor, parancssorból: README.md. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Validáció: haladás</title>
<style>
:root { --bg: #fbfaf7; --fg: #1d1d1b; --muted: #6b6a66; --line: #dedbd3; --accent: #2f5d8a; --chip: #f1efe9; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #171716; --fg: #ecebe6; --muted: #a3a29c; --line: #3a3935; --accent: #8ab4e0; --chip: #2c2b28; }
}
body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, "Segoe UI", Roboto, Arial, sans-serif; }
main { max-width: 900px; margin: 0 auto; padding: 16px; }
h1 { font-size: 1.25rem; }
input, button { font: inherit; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--chip); color: var(--fg); }
input { width: 100%; box-sizing: border-box; margin: 6px 0; }
button { background: var(--accent); color: #fff; border-color: var(--accent); cursor: pointer; }
table { border-collapse: collapse; width: 100%; margin-top: 12px; }
td, th { border-bottom: 1px solid var(--line); padding: 6px 8px; text-align: left; }
.muted { color: var(--muted); font-size: .9rem; }
.halad { height: 6px; background: var(--chip); border-radius: 3px; overflow: hidden; min-width: 80px; }
.halad > div { height: 100%; background: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Károli–Strong validáció: haladás</h1>
  <p class="muted">Ellenőrönként: hány tételnél van ítélet, mikor mentett utoljára, beküldte-e. Az ítéleteket ez az oldal nem mutatja.</p>
  <label for="kulcs">Admin-kulcs (a letétben: <code>admin_kulcs.txt</code>):</label>
  <input type="password" id="kulcs" autocomplete="off">
  <button id="frissit" type="button">Frissítés</button>
  <p class="muted" id="info"></p>
  <table id="tabla" hidden>
    <thead><tr><th>ellenőr</th><th>szerep</th><th>ítélet</th><th></th><th>utolsó mentés</th><th>beküldve</th></tr></thead>
    <tbody id="sorok"></tbody>
  </table>
</main>
<script>
"use strict";
function $(id) { return document.getElementById(id); }
function ido(s) { return s ? new Date(s).toLocaleString("hu-HU") : "–"; }
function td(sor, szoveg) { var c = document.createElement("td"); c.textContent = szoveg; sor.appendChild(c); return c; }
try { $("kulcs").value = sessionStorage.getItem("ksval:admin") || ""; } catch (e) {}
function frissit() {
  var k = $("kulcs").value.trim();
  try { sessionStorage.setItem("ksval:admin", k); } catch (e) {}
  $("info").textContent = "Lekérdezés…";
  fetch("/api/admin/haladas", { headers: { Authorization: "Bearer " + k } }).then(function (r) {
    if (r.status === 401) throw new Error("érvénytelen admin-kulcs");
    if (!r.ok) throw new Error("a szerver hibát adott: " + r.status);
    return r.json();
  }).then(function (d) {
    var tb = $("sorok"); tb.textContent = "";
    d.ellenorok.forEach(function (e) {
      var sor = document.createElement("tr");
      td(sor, e.ellenor);
      td(sor, { kulso: "külső", masodik: "második ítélő", proba: "próba" }[e.szerep] || e.szerep);
      td(sor, e.itelet_db + " / " + e.tetelszam);
      var c = td(sor, ""), h = document.createElement("div"), b = document.createElement("div");
      h.className = "halad"; b.style.width = (100 * e.itelet_db / e.tetelszam) + "%"; h.appendChild(b); c.appendChild(h);
      td(sor, ido(e.utolso_mentes));
      td(sor, e.kesz_ido ? ido(e.kesz_ido) : "nem");
      tb.appendChild(sor);
    });
    $("tabla").hidden = false;
    $("info").textContent = "Frissítve: " + ido(d.ido);
  }).catch(function (x) { $("tabla").hidden = true; $("info").textContent = x.message; });
}
$("frissit").addEventListener("click", frissit);
$("kulcs").addEventListener("keydown", function (e) { if (e.key === "Enter") frissit(); });
</script>
</body>
</html>
