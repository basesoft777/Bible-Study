# ---------------------------------------------------------------------------------------------------------------------
# Kizárt osztályok (a regiszter-őr kimenetéből; M0 1.2 indokai szerint)
# Csak az az osztály áll itt, amely a felületen előfordul, és egyetlen [[elem]] szelektorában sem szerepel (a regiszter-őr
# mindkettőt ellenőrzi). Az állapot- és szövegrész-osztályok, amelyek egy szelektorban szerepelnek (pl. aktiv, kijelolt, he,
# gk, st), regisztráltnak számítanak, ezért nincsenek itt.
# ---------------------------------------------------------------------------------------------------------------------
[kizart]
# a nézetek rács-elrendezése; elrendezés-szerkesztés nincs a hatókörben
oszlopok = "a nézetek rács-tárolója; az oszlopköz (space-oszlopkoz) elrendezési érték, a tartalékon át állítható"
olvaso = "az Olvasópult rács-elrendezése (oszlopszélességek); elrendezés-szerkesztés nincs a hatókörben"
interlinearis = "az Interlineáris nézet rács-elrendezése; elrendezés-szerkesztés nincs a hatókörben"
munkaasztal = "a Munkaasztal rács-elrendezése; elrendezés-szerkesztés nincs a hatókörben"
# JavaScript-horgok
panel = "JavaScript-horog (fülváltás, töredék-betöltés); saját megjelenése nincs (a jobb oldali panel a 30. sor)"
ful-tartalom = "JavaScript-horog (a fül tartalma); saját megjelenése nincs"
fulek = "a fülek sora (flex-tároló, a köz a nézetváltó space-gombsor tokenje); a fül a 31–32. sor"
# tartalmi burkolók
szolap = "tartalmi burkoló (article); a megjelenés a gyermek-elemeken"
verslap = "tartalmi burkoló (article); a megjelenés a gyermek-elemeken"
# sablon-horgok, CSS-szabály nélkül
fejezetfej = "sablon-horog (a fejezet-lap címe és lapozója); CSS-szabály nincs rá"
lapozo = "sablon-horog (előző/következő fejezet); CSS-szabály nincs rá"
ketto = "sablon-horog (a Munkaasztal két panele); CSS-szabály nincs rá"
# sor- és bekezdés-tárolók
il-szavak = "az interlineáris csempék sora; a csempék közti köz a 53. sor (Interlineáris csempe) tulajdonsága"
il-parositatlan = "a párosítatlan eredeti szavak sora (tároló); a betűmérete (fs-il-eredeti-sor) a tartalékon át állítható"
folyo = "a folyó szöveg bekezdés-tárolója; a betű a Folyó Károli-szöveg (24) tokenjeiből"
# lista-, görgető- és oszlop-tárolók
sorok = "a párlista sorainak tárolója (rács); a sor a 71. sor"
gordul = "görgető tároló (legnagyobb magasság); arculati értéke nincs"
lista = "felsorolás-tároló (behúzás); arculati értéke nincs"
jelek = "a jel-címkék tárolója; a címke a 68–69. sor"
konyvek = "a kezdőlap könyvlistájának hasábjai; elrendezési érték"
konyv = "egy könyv a kezdőlap listájában (details); a megjelenés a gyermek-elemeken"
fejezetek = "a fejezetszámok sora; a hivatkozás a 15. sor"
fejezet-nave = "a fejezet-szintű Nave-hivatkozások (details) tárolója"
angol-sor = "az angol csempék sora (flex-tároló); a csempe az 52. sor"
# hivatkozás- vagy sor-burkolók a csempén belül
he-fo = "hivatkozás-burkoló a héber csempén belül; a rámutatás-háttér (accent-soft) és lekerekítés (radius-kiemeles) a 28. sor tokenjei"
er-fo = "hivatkozás-burkoló az interlineáris csempén belül; a rámutatás-háttér a 28. sor tokenje"
er = "az interlineáris csempe eredeti-szó sora; a betűmérete (fs-il-eredeti-sor) a tartalékon át állítható"
ures-par = "üres pár jele az interlineáris csempén (–); arculati értéke nincs"
# szövegrész-horgok egy regisztrált elemen belül
mf = "szövegrész-horog a héber csempén (igealak); a betűmérete (fs-csempe-megj) a tartalékon át állítható"
kat = "szövegrész-horog: kattintható LXX-megfelelő (aláhúzás); a szín és a méret a 49. sor tokenje"
gr = "szövegrész-horog: görög szó az LXX-sorban; a méret és a szín az 50–51. sor tokenje"
ang = "szövegrész-horog: az angol szó a csempén; a betűmérete az 52. sor tokenje (fs-angol-szo)"
strong = "szövegrész-horog: Strong-szám hivatkozás a táblákban és a párosítatlan sorban; a színe a 15. sor (hivatkozás)"
fo = "szövegrész-horog: a párlista fő szava (vastagság, literál); a méret a 71. sor tokenje"
dom = "szövegrész-horog: az UBS-domén; a színe a 70. sor tulajdonsága (Domén színe)"
def = "szövegrész-horog: az UBS-definíció; a méret a 70. sor tokenje"
karoli-itt = "szövegrész-horog („Károli itt”) a szó-lapon; a megjegyzés (17. sor) tokenjeit használja"
alak = "szövegrész-horog (igealak sor) a szó-lapon; a megjegyzés (17. sor) tokenjeit használja"
szo-nincs = "párosítás nélküli Károli-szó; a folyó szöveg (24) színét örökli, saját arculati értéke nincs"
# állapot-osztályok saját token nélkül
nyelvtani = "állapot-osztály (nyelvtani elem: szaggatott keret, halványítás, literálok); saját tokenje nincs"
par-magas = "állapot-osztály (magas bizonyosságú pár: folytonos aláhúzás, literál); a színe a 26. sor tokenje"
nincs-jeloles = "állapot-osztály a szövegoszlopon (az olvaso.js adja, a „jelölés” kapcsoló kikapcsolva): a kötött szó aláhúzása eltűnik (literál); saját tokenje nincs"
# a body nézet-horga
nezet-olvaso = "a body nézet-horga; CSS-szabály nincs rá"
nezet-interlinearis = "a body nézet-horga; CSS-szabály nincs rá"
nezet-munkaasztal = "a body nézet-horga; CSS-szabály nincs rá"
# a keresőlap (M3) tárolói: a megjelenésük a meglévő tokenekből (betű: fs-karoli-panel, lh-karoli-panel; köz: space-blokkkoz; kiemelés: accent-soft, radius-kiemeles), a tartalékon át állíthatók
talalatok = "a keresőlap találatlistájának tárolója (számozott lista, rács); a köz a blokkköz (space-blokkkoz) tokenje"
