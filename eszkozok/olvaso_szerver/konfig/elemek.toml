# Az elem-regiszter (#98 M2): a tervező módban kiválasztható elemek, a magyar nevük és az állítható tulajdonságaik.
#
# Forrás: naplok/TERVEZO_MOD_M0.md 1.1 (A–L: 1–73. sor, a felhasználó jóváhagyása 2026-10-14; M: 74–83. sor, 2026-10-15).
# Egy [[elem]]: id (kisbetű, szám, kötőjel), nev (magyar név), csoport, szelektor (CSS), tulajdonsag (magyar név → token).
# A token a CSS-változó neve `--` nélkül: szín (bg, panel, fg, muted, rule, accent, accent-soft, gold, gold-soft, low),
# fs-* (betűméret), lh-* (sorköz), space-* (térköz), radius-* (lekerekítés); a token-fájl: konfig/arculat.json.
# A tulajdonság típusa a tokenből jön (szín → palettaminta, hossz és sorköz → csúszka). Csak az itt szereplő tokenek
# írhatók a mentési végponton (tervezo.py). A betűcsalád (font-*) nem állítható.
#
# A [kizart] tábla: a felület azon osztályai, amelyek egyetlen szelektorban sem szerepelnek, mert tisztán szerkezetiek
# (osztály = "indok"). A regiszter-őr (regiszter_or.py, teszt_tervezo.py) ellenőrzi, hogy a felület minden osztálya vagy egy
# szelektorban, vagy itt áll; az itteni osztály a felületen előfordul, és egyetlen szelektorban sem szerepel.

