# Az olvasói szerver konfigurációja (#76 M2). Környezeti változóval felülírható:
#   PARDES_DB, PARDES_KIADAS, PARDES_KONFIG_DIR
# A fájlt a repó tartalmazza; titkot nem hordoz.

# A pardes.db helye. Üres = a repó gyökerének pardes.db-je (fejlesztés); a célgépen a PARDES_DB felülírja.
db = ""

# kiadás: belso | nyilvanos | kereskedelmi (DT124)
#   belso         minden blokk
#   nyilvanos     a KJV-Strong blokk (GPL) kimarad
#   kereskedelmi  a KJV-Strong és az MCGED (nem kereskedelmi) is kimarad
kiadas = "belso"

[suti]
# a rétegeket (#134, DT-F134f (b): ma egy réteg, az interlineáris sor) megjegyző funkcionális süti (DT146/4): csak a réteg
# kapcsolásakor (/reteg/<nev>/<be|ki>, a régi /nezet/<nev> álnéven) jön létre; a `?reteg=` felülírja. A régi `pardes_nezet`
# sütit a szerver nem olvassa.
nev = "pardes_reteg"
szint_nev = "pardes_szint"   # a hozzáférési szintet megjegyző süti: CSAK a belso kiadásban, csak szintváltáskor (F76.34)
max_kor_mp = 31536000     # 1 év
secure = false            # HTTPS mögött (VPS) true

[gyorsitotar]
max_lap = 512
max_bajt = 67108864       # 64 MB

[lapozas]
# a keresés (M3) oldalmérete; az M2 nem használja
oldalmeret = 50
