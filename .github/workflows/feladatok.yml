name: feladatok-frissites

# F20 B6 (D25): a FELADATOK.md generalt blokkjat csak ez a main-re futo
# Action irja; PR nem szerkesztheti (E18). A gep sajat commitja
# GITHUB_TOKEN-nel megy, ezert nem inditja ujra a munkafolyamatokat.

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: feladatok-frissites
  cancel-in-progress: false

jobs:
  generalas:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python telepitese
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fejlecek ellenorzese
        run: python eszkozok/feladatok.py ellenoriz

      - name: FELADATOK.md generalasa
        run: python eszkozok/feladatok.py general

      - name: Gepi commit, ha van valtozas
        run: |
          if git diff --quiet -- FELADATOK.md; then
            echo "FELADATOK.md valtozatlan."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add FELADATOK.md
          git commit -m "FELADATOK.md frissítés (gép)"
          git pull --rebase origin main
          git push origin HEAD:main
