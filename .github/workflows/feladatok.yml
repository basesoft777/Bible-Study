name: feladatok-frissites

# F20 B6 (D25) + F30 + F124 + F150 + F201: a main-re futo gepi Action. EGY futas, EGY commit.
#
# Eddig negy kulon workflow commitolt a main-re minden merge utan (szamkiosztas, FELADATOK.md-frissites,
# GERINC_TERKEP, ELOSZURES); most ez a workflow csinalja a ketto elsot, es a masik kettot is, ha az
# esemeny azokat erinti (F201, DT-F201c). A lepesek sorrendje:
#   1. szamkiosztas (eszkozok/szamkiosztas.py): a DT-F/N-F/D-F helyorzobol veglegesszam;
#   2. MINDIG (F217): a generalt nezetek ujragenerálasa a jegyzek (adat/generalt_nezetek.tsv) szerint
#      (eszkozok/generalt_nezetek.py --ir: lexikonlap, marker-blokkok, nyilt mag) -- az agak nem commitoljak oket;
#      utana a lemezt olvaso kapuk a friss nezeten, a commit elott (F217.5); a kiosztas is ide fut be (F201, DT-F201a);
#   2b. a mergelt PR briefjenek lezarasa + a `lezar:` N-tetelek lezarasa (eszkozok/brief_lezaras.py, DT-F219a);
#   3. FELADATOK.md + feladattérkép;
#   4. GERINC_TERKEP es ELOSZURES, ha a push az ő bemenetüket érintette (a regi `paths:` listak itt);
#   5. egyetlen gepi commit, egyetlen push (eszkozok/gepi_commit_uzenet.py adja az uzenetet);
#   6. a lefoglalt (foglalas/F<nn>) feladatszamok torlese, ha a szamnak mar van briefje.
# A GERINC_TERKEP es az ELOSZURES sajat workflow-ja (gerinc_terkep.yml, jelolt_eloszures.yml) csak az utemezett
# es a kezi futast tartja meg.
#
# A main-t ruleset vedi (PR kotelezo, kotelezo checkek), az egyetlen bypass a `pardes-feladatok` GitHub App
# (Contents: read and write, csak erre a repora telepitve). A push ennek az App-nak a tokenjevel megy; a
# workflow sajat GITHUB_TOKEN-je csak olvas. Titkok: FELADATOK_APP_ID, FELADATOK_APP_KEY.
#
# Az App-tokennel vegzett push uj futast indit (a GITHUB_TOKEN-nel nem), ezert a gep sajat commitjanak
# futasa a `[bot]` actor miatt kimarad; ha mégis lefutna, minden lepes idempotens (nincs diff -> nincs
# commit), tehat nincs vegtelen hurok.

on:
  push:
    branches: [main]
  workflow_dispatch:   # kézi újragenerálás / számkiosztás, ha egy futás elveszett (N-F118a, CI.PRALAP.2)

permissions:
  contents: read

concurrency:
  # CI.PRALAP.2: a bot-commit futasa a job `if`-je miatt kimarad, de a csoportban
  # kiszoritana a varakozo (emberi) futast (csak egy varakozo lehet). A bot-futas
  # ezert sajat, egyedi csoportba kerul.
  group: ${{ endsWith(github.actor, '[bot]') && format('bot-{0}', github.run_id) || 'feladatok-frissites' }}
  cancel-in-progress: false

jobs:
  generalas:
    if: ${{ !endsWith(github.actor, '[bot]') }}
    runs-on: ubuntu-latest
    steps:
      - name: App-token (pardes-feladatok)
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.FELADATOK_APP_ID }}
          private-key: ${{ secrets.FELADATOK_APP_KEY }}

      - name: Checkout (a main aktualis csucsa, nem az esemeny commitja)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}

      - name: Python telepitese
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Szamkiosztas (van-e helyorzo?)
        run: python eszkozok/szamkiosztas.py --ir --uzenet-fajl "$RUNNER_TEMP/szamkiosztas_uzenet.txt"

      # F217: a generalt nezetek (lap, marker-blokkok, nyilt mag) MINDIG ujragenerálodnak a jegyzek (adat/generalt_nezetek.tsv)
      # szerint, nem csak kiosztas utan: az agak mar nem commitoljak oket. Kilepesi kod: 1 = generalasi hiba (semmi nem
      # irodott; a futas megall, nincs commit); 2 = orzott (kiadott) lap valtozna uj kiadas nelkul (a lap nem irodott ki,
      # a tobbi nezet igen; a commit megy, a futas a vegen piros).
      - name: Generalt nezetek ujragenerálasa a jegyzek szerint (F217; mindig)
        id: generalt
        run: |
          set +e
          python eszkozok/generalt_nezetek.py --ir --jelentes "$RUNNER_TEMP/generalt_jelentes.md"
          KG=$?
          cat "$RUNNER_TEMP/generalt_jelentes.md" >> "$GITHUB_STEP_SUMMARY"
          echo "kod=$KG" >> "$GITHUB_OUTPUT"
          if [ "$KG" = "1" ]; then echo "::error::F217: generalasi hiba, nincs commit"; exit 1; fi
          if [ "$KG" = "2" ]; then echo "::error::F217: orzott (kiadott) lap valtozna uj kiadas nelkul; a lap nem irodott ki"; fi
          exit 0

      # F217.5: a ket PR kozti szemantikus utkozes haloja -- mindketto kulon zold volt, az egyuttesuk nem. A lemezt olvaso
      # kapuk (E29, E38, E39, olvasoi kapu) a friss nezeten, a commit ELOTT; bukasnal nincs commit, a futas piros.
      - name: Kapuk a friss nezeten, a commit elott (F217.5)
        run: |
          set +e
          python eszkozok/generalt_nezetek.py --kapuk --jelentes "$RUNNER_TEMP/kapu_jelentes.md"
          KK=$?
          cat "$RUNNER_TEMP/kapu_jelentes.md" >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/kapu_jelentes.md"
          exit $KK

      # DT-F219a (M-GAZDATLAN): a mergelt PR briefje `lezarva`, a `lezar:` N-tetelei lezarva -- a szamkiosztas UTAN
      # (a `lezar:` helyorzoi mar veglegszamok), az `ellenoriz` es a FELADATOK.md-generalas ELOTT. Allapotalapu es
      # idempotens (egy elveszett futast a kovetkezo potol); a feltetel: eszkozok/brief_lezaras.py. Hibaja nem
      # akasztja a szamkiosztas-commitot (a kapu: `feladatok.py ellenoriz` JELENTES).
      - name: Mergelt PR briefjenek lezarasa (DT-F219a)
        continue-on-error: true
        run: python eszkozok/brief_lezaras.py --ir --uzenet-fajl "$RUNNER_TEMP/brief_lezaras_uzenet.txt"

      - name: Fejlecek ellenorzese
        run: python eszkozok/feladatok.py ellenoriz

      - name: FELADATOK.md generalasa
        run: python eszkozok/feladatok.py general

      - name: Feladatterkep generalasa (F53)
        run: python eszkozok/feladatterkep.py

      - name: Mi valtozott az esemenyben (a GERINC_TERKEP es az ELOSZURES bemenete)
        id: valt
        env:
          ELOTTE: ${{ github.event.before }}
        run: |
          # ALLAPOTALAPU (egy kiszoritott futas valtozasat a kovetkezo sem veszti el): az utolso gepi
          # kimenet ota valtozott fajlok + a push elotti allapot es a munkafa kozti kulonbseg (ez a
          # szamkiosztas es a generalas sajat valtozasait is tartalmazza)
          : > "$RUNNER_TEMP/valtozott_g.txt"; : > "$RUNNER_TEMP/valtozott_e.txt"
          LAST_G=$(git log -1 --format=%H -- naplok/GERINC_TERKEP.tsv)
          LAST_E=$(git log -1 --format=%H -- 'naplok/ELOSZURES_*.tsv')
          if [ -n "$LAST_G" ]; then git diff --name-only "$LAST_G" > "$RUNNER_TEMP/valtozott_g.txt"; fi
          if [ -n "$LAST_E" ]; then git diff --name-only "$LAST_E" > "$RUNNER_TEMP/valtozott_e.txt"; fi
          if [ -n "$ELOTTE" ] && [ "$ELOTTE" != "0000000000000000000000000000000000000000" ] \
             && git cat-file -e "$ELOTTE^{commit}" 2>/dev/null; then
            git diff --name-only "$ELOTTE" | tee -a "$RUNNER_TEMP/valtozott_g.txt" >> "$RUNNER_TEMP/valtozott_e.txt"
          fi
          GERINC='^(adat/(motivumok|elofordulasok|jeloltek|grammatikai_strongok)\.tsv|konkordancia/(TAHOT_kivonat|TAGNT_kivonat|Konyv_normalizalo_tabla)\.tsv|(genezis|ujszovetseg|melyelemzesek)/|eszkozok/(gerinc_terkep|gerinc_kartya|gerinc_szuro|general|lekerdez|strong_util)\.py|\.github/workflows/(gerinc_terkep|feladatok)\.yml)'
          ELOSZ='^(adat/(jeloltek|elofordulasok|motivumok|grammatikai_strongok)\.tsv|konkordancia/(TAHOT_kivonat|TAGNT_kivonat|Karoli_1908)\.tsv|eszkozok/jelolt_eloszures\.py|\.github/workflows/(jelolt_eloszures|feladatok)\.yml)'
          if grep -Eq "$GERINC" "$RUNNER_TEMP/valtozott_g.txt"; then echo "gerinc=igen" >> "$GITHUB_OUTPUT"; else echo "gerinc=nem" >> "$GITHUB_OUTPUT"; fi
          if grep -Eq "$ELOSZ" "$RUNNER_TEMP/valtozott_e.txt"; then echo "eloszures=igen" >> "$GITHUB_OUTPUT"; else echo "eloszures=nem" >> "$GITHUB_OUTPUT"; fi

      - name: Terkep generalasa (GERINC_TERKEP, F124)
        id: gerinc
        if: ${{ steps.valt.outputs.gerinc == 'igen' }}
        continue-on-error: true
        run: python eszkozok/gerinc_terkep.py --kimenet naplok

      - name: Elo-szures generalasa (ELOSZURES, F150)
        id: eloszures
        if: ${{ steps.valt.outputs.eloszures == 'igen' }}
        continue-on-error: true
        run: python eszkozok/jelolt_eloszures.py --kimenet naplok

      - name: Hibas gepi kimenet visszaallitasa (egy masodlagos generalas hibaja nem akasztja a commitot)
        if: ${{ steps.gerinc.outcome == 'failure' || steps.eloszures.outcome == 'failure' }}
        run: |
          if [ "${{ steps.gerinc.outcome }}" = "failure" ]; then
            git checkout -- naplok/GERINC_TERKEP.tsv naplok/GERINC_TERKEP.md
          fi
          if [ "${{ steps.eloszures.outcome }}" = "failure" ]; then
            git checkout -- 'naplok/ELOSZURES_*.tsv'
            git clean -fq -- 'naplok/ELOSZURES_*.tsv'
          fi
          echo "::warning::egy masodlagos generalas hibaval allt le; a kimenete nem kerul a commitba"

      - name: Egyetlen gepi commit, ha van valtozas
        run: |
          git add -u
          git add -A -- FELADATOK.md FELADATTERKEP.html feladatterkep.json naplok nyilt_mag lexikon
          if git diff --cached --quiet; then
            echo "Nincs valtozas: nincs commit."
            exit 0
          fi
          git config user.name "pardes-feladatok[bot]"
          git config user.email "pardes-feladatok[bot]@users.noreply.github.com"
          python eszkozok/gepi_commit_uzenet.py --szam-uzenet "$RUNNER_TEMP/szamkiosztas_uzenet.txt" --torzs-fajl "$RUNNER_TEMP/brief_lezaras_uzenet.txt" > "$RUNNER_TEMP/commit_uzenet.txt"
          git -c i18n.commitEncoding=UTF-8 commit -F "$RUNNER_TEMP/commit_uzenet.txt"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Teljesult feladatszam-foglalasok torlese (F201)
        run: python eszkozok/foglalas_takarit.py

      - name: Orzott lap jelzese (F217, a kiadott lap nem valtozik csendben)
        if: ${{ steps.generalt.outputs.kod == '2' }}
        run: |
          echo "::error::F217: egy kiadott lap tartalma valtozna uj kiadas nelkul; a lap nem irodott ki. Ut: /kiadas <ID> (uj kiadas) vagy /lap-javit <ID> (javitas kiadas nelkul). Reszletek a lepes-osszefoglaloban."
          exit 1
