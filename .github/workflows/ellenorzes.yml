name: ellenorzes

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  ellenorzes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python telepitese
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Alap es fej meghatarozasa, valtozott fajlok listaja
        id: diff
        env:
          EVENT_NEV: ${{ github.event_name }}
          PR_ALAP_SHA: ${{ github.event.pull_request.base.sha }}
          PR_FEJ_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_ELOTTE: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NEV" = "pull_request" ]; then
            # Az alap a ket ag kozos ose, nem a main aktualis csucsa: a base.sha
            # a main csucsa, es ahhoz kepest minden, ami a fork ota a main-re
            # kerult, az agon forditott valtozasnak (torolt cimsor: E5,
            # ellenorzo-modositas: E16) latszott (PR #195). A fetch-depth: 0
            # miatt a merge-base elerheto; ha megsem, marad a base.sha.
            HEAD="$PR_FEJ_SHA"
            BASE=$(git merge-base "$PR_ALAP_SHA" "$HEAD" 2>/dev/null || echo "$PR_ALAP_SHA")
          else
            BASE="$PUSH_ELOTTE"
            HEAD="$PUSH_SHA"
          fi
          # push-esemenynel az elso commit "elotte"-je csupa nulla lehet --
          # ilyenkor nincs ertelmes alap, a diff-hatokor (D8/D3) nem
          # ertelmezheto, HIBA helyett mindenki JELENTES-t kap.
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE=""
          fi
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "head=$HEAD" >> "$GITHUB_OUTPUT"
          if [ -n "$BASE" ]; then
            git diff --name-only "$BASE" "$HEAD" > valtozott_fajlok.txt
            # E5: a PR/push osszes commit-uzenete, osszefuzve, fajlba --
            # ekezetes/idezojeles szoveg miatt fajlon at, nem shell-argumentumkent
            # (CLAUDE.md "Shell" szakasz).
            git log --format=%B "$BASE".."$HEAD" > commit_uzenetek.txt
          else
            : > valtozott_fajlok.txt
            : > commit_uzenetek.txt
          fi
          echo "Valtozott fajlok:"
          cat valtozott_fajlok.txt

      - name: E2-E27 (eszkozok/ellenorzes/futtat.py; E27 = hivatkozas-ellenorzes, F40)
        id: e2e16
        env:
          DIFF_ALAP: ${{ steps.diff.outputs.base }}
          DIFF_FEJ: ${{ steps.diff.outputs.head }}
          PR_CIM: ${{ github.event.pull_request.title }}
          EVENT_NEV: ${{ github.event_name }}
        run: |
          set +e
          if [ -s valtozott_fajlok.txt ]; then
            python eszkozok/ellenorzes/futtat.py \
              --valtozott $(cat valtozott_fajlok.txt | tr '\n' ' ') \
              --diff-alap "$DIFF_ALAP" \
              --diff-fej "$DIFF_FEJ" \
              --pr-cim "$PR_CIM" \
              --esemeny "$EVENT_NEV" \
              --commit-uzenet-fajl commit_uzenetek.txt \
              > e2e16_jelentes.md
            KILEPES=$?
          else
            echo "# Ellenorzes jelentes (nincs valtozott fajl)" > e2e16_jelentes.md
            KILEPES=0
          fi
          cat e2e16_jelentes.md >> "$GITHUB_STEP_SUMMARY"
          echo "kilepes=$KILEPES" >> "$GITHUB_OUTPUT"
          exit $KILEPES

      - name: E1 (eszkozok/ellenoriz.py --study, mindig fut)
        id: e1
        if: always()
        run: |
          set +e
          python eszkozok/ellenorzes/study_fajlok_szurese.py < valtozott_fajlok.txt > study_fajlok.txt
          STUDY_ARGS=""
          while IFS= read -r f; do
            [ -n "$f" ] && STUDY_ARGS="$STUDY_ARGS --study $f"
          done < study_fajlok.txt
          python eszkozok/ellenoriz.py $STUDY_ARGS --md e1_jelentes.md
          KILEPES=$?
          {
            echo "## E1 (eszkozok/ellenoriz.py)"
            echo ""
            cat e1_jelentes.md
          } >> "$GITHUB_STEP_SUMMARY"
          echo "kilepes=$KILEPES" >> "$GITHUB_OUTPUT"
          exit $KILEPES

      # F37 T3: a tanulmany-szabalyok (E20; E8/E9/E12/E13 tanulmanyra bovitve)
      # kotelezo modja a fenti futtat.py-ban fut (csak az uj/modositott
      # tanulmanyfajl, D8). Ez a lepes a jelentes mod: MINDEN tanulmanyfajl,
      # nem bukik (a helyi, verziozott pillanatkep: naplok/TANULMANY_AUDIT.md).
      - name: Tanulmany-audit (jelentes mod, nem bukik)
        if: always()
        continue-on-error: true
        run: |
          python eszkozok/ellenorzes/tanulmany_audit.py > tanulmany_audit.md || true
          {
            echo "## Tanulmany-audit (jelentes mod, nem bukik)"
            echo ""
            head -c 900000 tanulmany_audit.md
          } >> "$GITHUB_STEP_SUMMARY"

      # F37 T3: a szabalyok pozitiv/negativ tesztjei (E2-E27, F37 tanulmany-szabalyok)
      - name: Szabaly-tesztek
        id: tesztek
        if: always()
        run: |
          set +e
          python eszkozok/ellenorzes/tesztek/test_szabalyok.py
          K1=$?
          python eszkozok/ellenorzes/tesztek/test_tanulmany.py
          K2=$?
          if [ "$K1" != "0" ] || [ "$K2" != "0" ]; then KILEPES=1; else KILEPES=0; fi
          echo "kilepes=$KILEPES" >> "$GITHUB_OUTPUT"
          exit $KILEPES

      - name: Jelentes PR-kommentkent
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_SZAM: ${{ github.event.pull_request.number }}
        run: |
          python eszkozok/ellenorzes/pr_komment.py e2e16_jelentes.md e1_jelentes.md

      - name: Bukas, ha E1 vagy E2-E27 HIBA-t jelzett, vagy a szabaly-teszt bukott
        if: always()
        env:
          E2E16_KILEPES: ${{ steps.e2e16.outputs.kilepes }}
          E1_KILEPES: ${{ steps.e1.outputs.kilepes }}
          TESZT_KILEPES: ${{ steps.tesztek.outputs.kilepes }}
        run: |
          if [ "$E2E16_KILEPES" != "0" ] || [ "$E1_KILEPES" != "0" ] || [ "$TESZT_KILEPES" != "0" ]; then
            echo "Van HIBA-szintu talalat vagy bukott teszt (E2-E27 kilepes: $E2E16_KILEPES, E1 kilepes: $E1_KILEPES, tesztek: $TESZT_KILEPES)."
            exit 1
          fi
          echo "Minden ellenorzes RENDBEN."

  # F20 B6: a feladatkovetes szabalya (E18) -- kulon job, a fenti lepeseket
  # nem modositja (D6). A beerkezo/ mappa nincs a hatokoren.
  feladatkovetes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python telepitese
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: E18 -- fejlecek ervenyessege, a generalt blokkot a PR nem modositja
        env:
          EVENT_NEV: ${{ github.event_name }}
          PR_ALAP_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NEV" = "pull_request" ]; then
            python eszkozok/feladatok.py ellenoriz --pr-alap "$PR_ALAP_SHA"
          else
            python eszkozok/feladatok.py ellenoriz
          fi

      - name: feladatok.py tesztek
        run: python eszkozok/teszt_feladatok.py
